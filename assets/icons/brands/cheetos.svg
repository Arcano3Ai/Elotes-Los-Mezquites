<svg viewBox="0 0 160 50" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cheetos">
  <!-- Cheetos Dark Pill Backdrop -->
  <rect x="4" y="6" width="152" height="38" rx="19" fill="#1A1412" stroke="#F79239" stroke-width="1.5"/>
  <!-- Cheetah spots -->
  <circle cx="20" cy="16" r="3.5" fill="#F79239"/>
  <circle cx="140" cy="34" r="4" fill="#D81E05"/>
  <circle cx="148" cy="17" r="2.5" fill="#FFF100"/>
  <!-- Cheetos Graffiti Typography -->
  <text x="78" y="34" fill="#F79239" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-size="25" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="-0.5" stroke="#FFF100" stroke-width="1.8" paint-order="stroke fill">Cheetos</text>
  <!-- Flame accent dot on o -->
  <circle cx="125" cy="18" r="3" fill="#D81E05"/>
</svg>
