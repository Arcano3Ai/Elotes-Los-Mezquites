<svg viewBox="0 0 160 50" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Doritos">
  <defs>
    <linearGradient id="doritosFire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEA515"/>
      <stop offset="45%" stop-color="#F1700A"/>
      <stop offset="100%" stop-color="#DE4E1C"/>
    </linearGradient>
  </defs>
  <!-- Iconic Triangle Shadow/Base -->
  <polygon points="18,44 76,4 142,44" fill="#140A06" stroke="#DE4E1C" stroke-width="2"/>
  <polygon points="34,41 76,11 126,41" fill="url(#doritosFire)" opacity="0.9"/>
  <!-- Doritos Wordmark -->
  <text x="80" y="36" fill="#FFFFFF" font-family="'Impact', 'Arial Black', sans-serif" font-size="26" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="1" stroke="#000000" stroke-width="2" paint-order="stroke fill">DORITOS</text>
  <!-- Spark chip accent -->
  <polygon points="86,8 93,17 81,14" fill="#FEA515"/>
</svg>
