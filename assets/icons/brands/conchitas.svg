<svg viewBox="0 0 160 50" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Conchitas Encanto">
  <defs>
    <linearGradient id="encantoRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#8E091F"/>
    </linearGradient>
  </defs>
  <!-- Oval Emblem Badge -->
  <rect x="2" y="4" width="156" height="42" rx="21" fill="url(#encantoRed)" stroke="#FDB813" stroke-width="2.5"/>
  <rect x="6" y="8" width="148" height="34" rx="17" fill="none" stroke="#FFFFFF" stroke-dasharray="3 2" stroke-width="1" opacity="0.6"/>
  <!-- Top Tag -->
  <text x="80" y="16" fill="#FDB813" font-family="'Arial Black', system-ui, sans-serif" font-weight="900" font-size="7" text-anchor="middle" letter-spacing="2">BOTANAS</text>
  <!-- Main Script Brand "Encanto" -->
  <text x="80" y="34" fill="#FFFFFF" font-family="'Brush Script MT', 'Pacifico', cursive, serif" font-size="21" font-weight="bold" font-style="italic" text-anchor="middle">Encanto</text>
  <!-- Subtitle -->
  <text x="80" y="43" fill="#FDB813" font-family="system-ui, sans-serif" font-weight="800" font-size="5.5" text-anchor="middle" letter-spacing="1">CONCHITAS · MTY 1957</text>
</svg>
